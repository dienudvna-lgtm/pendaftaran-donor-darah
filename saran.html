<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Saran - PMI Connect" />
    <meta name="description" content="Kirim saran dan masukan untuk pengembangan layanan PMI Connect dan kegiatan PMI di Indonesia." />
    <title>Saran - PMI Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-shell">
        <a href="home.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-shield-heart"></i></span> PMI Connect</a>
        <nav class="nav-links">
          <a href="home.html">Home</a>
          <a href="about-pmi.html">About</a>
          <a href="event.html">Event</a>
          <a class="active" href="saran.html">Saran</a>
          <a href="contact.html">Kontak</a>
          <a href="profile.html">Profile</a>
          <a href="#" class="logout-link">Logout</a>
        </nav>
        <div class="nav-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><i class="fa-regular fa-moon"></i></button>
          <button class="icon-btn mobile-toggle" aria-label="Toggle nav"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </header>

    <main class="container" style="padding:40px 0 80px;">
      <div class="section-title" data-aos="fade-up">
        <h2>Kirim Saran</h2>
        <p>Berikan masukan Anda untuk meningkatkan layanan dan kegiatan PMI Connect.</p>
      </div>
      <div class="card" data-aos="fade-up" style="padding:32px; max-width:720px; margin:0 auto;">
        <form id="suggestionForm">
          <div class="form-grid">
            <div><label for="suggestionName">Nama</label><input id="suggestionName" type="text" placeholder="Nama lengkap" required /></div>
            <div><label for="suggestionEmail">Email</label><input id="suggestionEmail" type="email" placeholder="Email Anda" required /></div>
            <div><label for="suggestionCategory">Kategori</label><select id="suggestionCategory" required><option value="">Pilih kategori</option><option value="Aplikasi">Aplikasi</option><option value="Event">Event</option><option value="Donor Darah">Donor Darah</option><option value="Relawan">Relawan</option><option value="Umum">Umum</option></select></div>
            <div><label for="suggestionMessage">Isi Saran</label><textarea id="suggestionMessage" rows="6" placeholder="Tulis saran Anda di sini" required></textarea></div>
          </div>
          <button class="btn btn-primary" type="submit">Kirim Saran</button>
        </form>
      </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pmi.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
      requireUserAuth();
      AOS.init({ duration: 800, once: true, offset: 80 });
    </script>
  </body>
</html>
